<!-- Theme default follows the device: light on phones/tablets, dark on
     laptops and desktops. An explicit choice always wins. Runs before
     paint, so there is no flash of the wrong theme. -->
<script>(function(){try{var d=document.documentElement,t=localStorage.getItem('vx-theme');if(!t)t=window.matchMedia('(max-width: 820px)').matches?'light':'dark';d.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>

<style>
  /* The sheet is reached by scanning a QR off a carton, so it is built to be
     read on a phone in a store room and then printed on A4 without a second
     stylesheet fighting it. */
  .ds-wrap { max-width: 920px; margin-inline: auto; }
  .ds-head {
    display: grid; grid-template-columns: 1fr auto; gap: var(--s-6);
    align-items: start; padding-bottom: var(--s-5);
    border-bottom: 2px solid var(--accent);
  }
  .ds-brand { font: 600 .82rem/1 var(--font-head); letter-spacing: .14em;
              text-transform: uppercase; color: var(--accent); }
  .ds-title { font: 800 clamp(1.9rem, 4.4vw, 2.9rem)/1.04 var(--font-head);
              margin-top: var(--s-2); }
  .ds-strap { color: var(--text-2); margin-top: var(--s-2); }
  .ds-code  { font-family: var(--font-mono); font-size: .8rem;
              color: var(--text-2); }
  .ds-sec { margin-top: var(--s-8); }
  .ds-sec h2 {
    font: 700 1.02rem/1.2 var(--font-head); letter-spacing: .04em;
    text-transform: uppercase; color: var(--accent);
    padding-bottom: var(--s-2); border-bottom: 1px solid var(--border);
  }
  .ds-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-7); }
  @media (max-width: 760px) { .ds-grid { grid-template-columns: 1fr; } }
  .ds-steps { counter-reset: ds; list-style: none; padding: 0;
              margin: var(--s-4) 0 0; }
  .ds-steps li { counter-increment: ds; position: relative;
                 padding-left: 34px; margin-top: var(--s-4); }
  .ds-steps li::before {
    content: counter(ds); position: absolute; left: 0; top: -1px;
    width: 23px; height: 23px; border-radius: 50%;
    background: var(--accent); color: #fff;
    font: 700 .78rem/23px var(--font-head); text-align: center;
  }
  .ds-list { list-style: none; padding: 0; margin: var(--s-4) 0 0; }
  .ds-list li { position: relative; padding-left: 20px;
                margin-top: var(--s-3); }
  .ds-list li::before {
    content: ""; position: absolute; left: 2px; top: .52em;
    width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
  }
  .ds-table { width: 100%; border-collapse: collapse; margin-top: var(--s-4); }
  .ds-table th, .ds-table td {
    text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border);
    font-size: .92rem; vertical-align: top;
  }
  .ds-table th { width: 40%; font-weight: 600; color: var(--text-2); }
  .ds-care { border-left: 3px solid var(--red-500);
             background: color-mix(in srgb, var(--red-500) 6%, transparent);
             padding: var(--s-4) var(--s-5); border-radius: var(--r-md);
             margin-top: var(--s-4); }
  .ds-care h2 { color: var(--red-600); border: 0; padding: 0; }
  .ds-note { color: var(--text-2); font-size: .86rem; margin-top: var(--s-5); }
  .ds-actions { display: flex; flex-wrap: wrap; gap: var(--s-3);
                margin-top: var(--s-8); }
  @media print {
    .site-header, .site-footer, .ds-actions, .scroll-cue-wrap { display: none !important; }
    .ds-wrap { max-width: none; }
    a[href]::after { content: ""; }
  }
</style>
