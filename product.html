<!-- Theme default follows the device: light on phones/tablets, dark on
     laptops and desktops. An explicit choice always wins. Runs before
     paint, so there is no flash of the wrong theme. -->
<script>(function(){try{var d=document.documentElement,t=localStorage.getItem('vx-theme');if(!t)t=window.matchMedia('(max-width: 820px)').matches?'light':'dark';d.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
