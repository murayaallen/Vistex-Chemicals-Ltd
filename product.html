<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Theme default follows the device: light on phones/tablets, dark on
     laptops and desktops. An explicit choice always wins. Runs before
     paint, so there is no flash of the wrong theme. -->
<script>(function(){try{var d=document.documentElement,t=localStorage.getItem('vx-theme');if(!t)t=window.matchMedia('(max-width: 820px)').matches?'light':'dark';d.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>

<title>Product — Vistex Chemicals Ltd</title>
<!-- This file is two things. As a page it only forwards old product.html?id=…
     links to the real product-<id>.html pages, so it is kept out of the index.
     As a template, tools/build-pages.js builds every product page from it and
     strips this robots tag from each one. Edit the layout here, then rebuild. -->
<meta name="robots" content="noindex, follow">

     but every other signal was silent about it: no lang region, no geo tags.
